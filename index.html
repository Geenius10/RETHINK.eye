<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EyeTrainer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>EyeTrainer</title>
<style>
:root{
  --ink:#0c111b; --muted:#7f8795; --paper:#f5f3ee; --panel:#ebe8e1; --blue:#2f6df6;
  --green:#24a148; --red:#d84040; --line:#d8d5cf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit}
.app{height:100dvh;max-width:820px;margin:0 auto;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom))}
.brand{font-weight:950;letter-spacing:-.045em;font-size:clamp(20px,3vw,26px)}
.home{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hero{font-size:clamp(48px,12vw,92px);font-weight:950;line-height:.82;letter-spacing:-.07em;margin-bottom:clamp(28px,5vh,48px)}
.play{
  width:clamp(112px,28vw,170px);aspect-ratio:1;border:0;border-radius:50%;background:var(--ink);
  position:relative;box-shadow:0 16px 50px rgba(12,17,27,.16);cursor:pointer
}
.play:after{content:"";position:absolute;left:43%;top:50%;transform:translate(-35%,-50%);width:0;height:0;border-top:22px solid transparent;border-bottom:22px solid transparent;border-left:34px solid white}

.player{display:none;position:fixed;inset:0;background:var(--paper);z-index:30}
.player.open{display:flex}
.shell{width:100%;max-width:820px;margin:auto;height:100dvh;padding:max(14px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.topbar{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px}
.close{width:44px;height:44px;border:0;border-radius:50%;background:#e9e6df;font-size:27px;color:var(--ink)}
.progressWrap{height:7px;background:#e4e1da;border-radius:999px;overflow:hidden}
.progress{height:100%;width:0;background:var(--blue);transition:width .3s ease}
.count{font-size:16px;font-weight:950;color:var(--blue);min-width:40px;text-align:right}
.stage{
  flex:1;min-height:0;position:relative;overflow:hidden;background:#eeece6;border-radius:34px;
  display:flex;align-items:center;justify-content:center
}
.meta{text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px;padding:0 8px}
.mode{font-size:12px;font-weight:950;letter-spacing:.19em;background:#e3e8f6;color:#244fbb;padding:9px 14px;border-radius:999px}
.mode.tap{background:#ebe6d8;color:#6d5420}.mode.head{background:#e3ece7;color:#2f6547}
.name{font-size:clamp(28px,5.2vw,42px);line-height:1;font-weight:950;letter-spacing:-.045em}
.desc{font-size:clamp(14px,2.8vw,18px);line-height:1.25;color:#6f7785;max-width:650px}
.substat{min-height:20px;font-size:13px;color:#7e8794;font-weight:800}
.action{width:100%;border:0;border-radius:24px;background:var(--ink);color:white;font-size:20px;font-weight:950;padding:20px 18px}
.action:disabled{opacity:.45}
.feedback{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:0;transition:opacity .08s ease}
.feedback.ok{background:rgba(36,161,72,.24)} .feedback.bad{background:rgba(216,64,64,.25)} .feedback.show{opacity:1}

/* core visuals */
.dot,.target{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--blue);transform:translate(-50%,-50%)}
.target{border:0;box-shadow:0 0 0 8px rgba(47,109,246,.10)}
.axis{position:absolute;background:#d2d0ca;border-radius:99px}
.axis.h{left:12%;right:12%;height:3px;top:50%}.axis.v{top:12%;bottom:12%;width:3px;left:50%}
.axis.d1,.axis.d2{left:13%;width:74%;height:3px;top:50%;transform:rotate(42deg)}.axis.d2{transform:rotate(-42deg)}
.fixPoint{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--blue);transform:translate(-50%,-50%);box-shadow:0 0 0 8px rgba(47,109,246,.09)}
.head{width:108px;height:132px;border:4px solid #c7cbd2;border-radius:50% 50% 43% 43%;background:#f7f6f2;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.head:before,.head:after{content:"";position:absolute;top:45px;width:12px;height:12px;border-radius:50%;background:var(--blue)}
.head:before{left:29px}.head:after{right:29px}
.headArrow{position:absolute;font-size:54px;font-weight:950;color:var(--blue)}
.fixLabel{position:absolute;bottom:16px;left:15px;right:15px;text-align:center;font-size:12px;font-weight:900;color:#6e7684}
.bigLetter{font-size:clamp(88px,25vw,170px);font-weight:950}
.periRing{width:min(68vw,340px);aspect-ratio:1;border:2px solid #d3d1cb;border-radius:50%;position:relative}
.periRing:before{content:"";position:absolute;inset:25%;border:2px solid #ddd9d2;border-radius:50%}
.periFix{position:absolute;left:50%;top:50%;width:18px;height:18px;background:var(--ink);border-radius:50%;transform:translate(-50%,-50%)}
.periFlash{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--blue);transform:translate(-50%,-50%)}
.nearfar{display:flex;align-items:center;gap:clamp(34px,9vw,90px)}.nearfar .near{font-size:76px;color:var(--blue)}.nearfar .far{font-size:120px;font-weight:950}
.rule{position:absolute;top:14px;left:14px;right:14px;text-align:center;font-size:11px;font-weight:950;letter-spacing:.08em;color:#687180}
.gngSymbol{font-size:clamp(90px,22vw,170px);font-weight:950}.gngShape{width:120px;height:120px;background:var(--blue)}.gngShape.circle{border-radius:50%}.gngArrow{font-size:130px;font-weight:950}
.stroopWord{font-size:clamp(66px,18vw,130px);font-weight:950;letter-spacing:-.04em}
.choices{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(92%,470px);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{border:0;border-radius:16px;padding:15px 10px;background:#fff;font-weight:950;box-shadow:0 4px 18px rgba(12,17,27,.07)}
.searchGrid{width:min(92%,520px);display:grid;grid-template-columns:repeat(var(--cols,7),1fr);gap:4px}
.searchGrid button{border:0;background:transparent;font-size:clamp(18px,5vw,34px);font-weight:900;padding:5px}
.motDot{position:absolute;width:28px;height:28px;border-radius:50%;border:0;background:#adb4bf;transform:translate(-50%,-50%)}.motDot.targeted{background:var(--blue);box-shadow:0 0 0 7px rgba(47,109,246,.12)}
.result{text-align:center}.result .eyebrow{font-size:11px;font-weight:950;letter-spacing:.18em;color:#7d8490}.result .big{font-size:clamp(58px,16vw,110px);font-weight:950;letter-spacing:-.06em;line-height:.9;margin:10px 0}.result .line{font-size:16px;color:#656d79;font-weight:800}
.summary{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}.summary h2{font-size:clamp(42px,10vw,72px);line-height:.9;letter-spacing:-.06em;margin:0}.summary p{margin:0;color:#6e7683;font-weight:800}
.isoPair{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,28px);width:96%}.iso{width:min(43vw,290px);height:min(43vw,290px);display:grid;place-items:center}.iso svg{width:100%;height:100%}
.motionArea{position:absolute;inset:0}.motionArea svg{position:absolute;inset:0;width:100%;height:100%}
.occluder{position:absolute;left:60%;top:7%;bottom:7%;width:20%;background:#dedbd4;border-left:2px solid #c8c5be;border-right:2px solid #c8c5be;z-index:4}
.goalLine{position:absolute;left:90%;top:7%;bottom:7%;border-left:4px dashed #596170;z-index:5}
.ball{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--blue);transform:translate(-50%,-50%);z-index:3}
.userMark,.truthMark{position:absolute;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%);z-index:8}.userMark{border:4px solid var(--blue);background:#fff}.truthMark{background:var(--green);box-shadow:0 0 0 4px #fff}
.motionHelp{position:absolute;left:12px;right:12px;bottom:14px;text-align:center;font-size:12px;font-weight:900;color:#646c79;z-index:10}
.motionTapZone{position:absolute;left:82%;right:0;top:0;bottom:0;z-index:7}
.pursuitDot{position:absolute;width:32px;height:32px;border-radius:50%;background:var(--blue);transform:translate(-50%,-50%)}
.figure8{width:min(80%,520px)}
.figure8 path{fill:none;stroke:#c8cbd1;stroke-width:5}
@media (orientation:landscape) and (max-height:560px){
 .shell{gap:7px}.stage{border-radius:24px}.meta{gap:4px}.desc{font-size:13px}.action{padding:14px}.name{font-size:27px}
}
</style>
</head>
<body>
<div class="app">
  <div class="brand">EYETRAINER</div>
  <main class="home"><div class="hero">PLAY.<br>TRAIN.</div><button class="play" id="play" aria-label="Training starten"></button></main>
</div>

<div class="player" id="player">
 <div class="feedback" id="feedback"></div>
 <div class="shell">
   <div class="topbar"><button class="close" id="close">×</button><div class="progressWrap"><div class="progress" id="progress"></div></div><div class="count" id="count">1/6</div></div>
   <div class="stage" id="stage"></div>
   <div class="meta"><div class="mode" id="mode">NUR SCHAUEN</div><div class="name" id="name"></div><div class="desc" id="desc"></div><div class="substat" id="substat"></div></div>
   <button class="action" id="action">START</button>
 </div>
</div>

<script>
(function(){
'use strict';
const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)];
const stage=$('#stage'), player=$('#player'), progress=$('#progress'), count=$('#count'), mode=$('#mode'), nameEl=$('#name'), desc=$('#desc'), substat=$('#substat'), action=$('#action');
const ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let session=[], index=0, state='home', timer=null, aux=[], raf=null, runToken=0, current=null;
let adaptive={reaction:2,inhibition:2,stroop:2,mental:2,search:2,mot:2,prediction:2};
let metrics=[];

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function timeout(fn,ms){const id=setTimeout(fn,ms);aux.push(id);return id}
function clearRun(){runToken++;if(timer)clearInterval(timer);timer=null;aux.forEach(clearTimeout);aux=[];if(raf)cancelAnimationFrame(raf);raf=null;stage.onclick=null}
function flash(ok){const f=$('#feedback');f.className='feedback '+(ok?'ok':'bad');requestAnimationFrame(()=>f.classList.add('show'));setTimeout(()=>f.classList.remove('show'),230)}
function setMode(m){mode.className='mode '+(m==='tap'?'tap':m==='head'?'head':'');mode.textContent=m==='tap'?'TIPPEN':m==='head'?'GUCKEN + KOPF':'NUR SCHAUEN'}
function fmtRT(v){return v?Math.round(v)+' ms':'–'}

const FIX=[
 {x:18,y:18,label:'links oben',arrow:'↘',ax:82,ay:78},
 {x:50,y:14,label:'oben Mitte',arrow:'↓',ax:50,ay:78},
 {x:82,y:18,label:'rechts oben',arrow:'↙',ax:18,ay:78},
 {x:15,y:50,label:'links Mitte',arrow:'→',ax:82,ay:50},
 {x:85,y:50,label:'rechts Mitte',arrow:'←',ax:18,ay:50},
 {x:18,y:82,label:'links unten',arrow:'↗',ax:82,ay:18},
 {x:50,y:86,label:'unten Mitte',arrow:'↑',ax:50,ay:18},
 {x:82,y:82,label:'rechts unten',arrow:'↖',ax:18,ay:18}
];

function composeSession(){
 const oculomotor=pick(['saccade','pursuit']);
 const focus=pick(['stabilize','nearFar']);
 const perception=pick(['alphabet','periphery']);
 const reaction='reaction';
 const inhibition=pick(['goNoGo','stroop']);
 const complex=pick(['mental','visualSearch','mot','motionPrediction']);
 return [makeExercise(oculomotor),makeExercise(focus),makeExercise(perception),makeExercise(reaction),makeExercise(inhibition),makeExercise(complex)];
}
function makeExercise(f){
 if(f==='saccade')return pick([
  {family:f,kind:'saccH',name:'Sakkaden horizontal',mode:'look',desc:'Kopf ruhig. Nur mit den Augen links ↔ rechts.',sec:24},
  {family:f,kind:'saccV',name:'Sakkaden vertikal',mode:'look',desc:'Kopf ruhig. Nur mit den Augen oben ↕ unten.',sec:24},
  {family:f,kind:'saccD1',name:'Sakkaden diagonal',mode:'look',desc:'Kopf ruhig. Zwischen links oben und rechts unten wechseln.',sec:24},
  {family:f,kind:'saccD2',name:'Sakkaden diagonal',mode:'look',desc:'Kopf ruhig. Zwischen rechts oben und links unten wechseln.',sec:24},
  {family:f,kind:'sacc4',name:'4-Punkt-Sakkaden',mode:'look',desc:'Nur den jeweils aktiven Punkt ansehen.',sec:28}
 ]);
 if(f==='pursuit')return pick([
  {family:f,kind:'pH',name:'Smooth Pursuit horizontal',mode:'look',desc:'Den Punkt flüssig verfolgen. Kopf ruhig.',sec:28},
  {family:f,kind:'pV',name:'Smooth Pursuit vertikal',mode:'look',desc:'Den Punkt flüssig hoch und runter verfolgen.',sec:28},
  {family:f,kind:'p8',name:'Figure-8 Tracking',mode:'look',desc:'Den Punkt gleichmäßig entlang der liegenden Acht verfolgen.',sec:30},
  {family:f,kind:'pC',name:'Kreis-Tracking',mode:'look',desc:'Den Punkt gleichmäßig im Kreis verfolgen.',sec:30}
 ]);
 if(f==='stabilize')return {family:f,kind:'stabilize',name:'Fixierung + Kopfbewegung',mode:'head',desc:'Vier Zielpositionen nacheinander. Punkt fixieren; Kopf immer exakt zur Gegenseite.',sec:24,sequence:shuffle(FIX).slice(0,4)};
 if(f==='nearFar')return {family:f,kind:'nearFar',name:'Nah–Fern Fokus',mode:'head',desc:'Daumen nah fokussieren, dann Bildschirmbuchstaben klar ansehen. Wiederholen.',sec:30};
 if(f==='alphabet')return {family:f,kind:'alphabet',name:'Alphabet groß ↔ klein',mode:'look',desc:'Buchstaben erkennen. Größe und Position wechseln.',sec:28};
 if(f==='periphery')return {family:f,kind:'periphery',name:'Peripherie',mode:'look',desc:'Zentrum halten. Randreize wahrnehmen – nicht antippen.',sec:28};
 if(f==='reaction')return {family:f,kind:'reaction',name:'Reaction Tap',mode:'tap',desc:'Leuchtenden Punkt antippen. Ziel wartet auf deinen Tap.',sec:20,level:adaptive.reaction};
 if(f==='goNoGo')return {family:f,kind:'gonogo',name:'Go / No-Go',mode:'tap',desc:'Regel beachten: GO tippen, NO-GO bewusst auslassen.',trials:12,level:adaptive.inhibition};
 if(f==='stroop')return {family:f,kind:'stroop',name:'Stroop',mode:'tap',desc:'Regel oben beachten. Farbe und Wort konkurrieren miteinander.',goal:10,level:adaptive.stroop};
 if(f==='mental')return {family:f,kind:'mental',name:'Mentale Rotation 3D',mode:'tap',desc:'Sind beide 3D-Objekte identisch gedreht oder gespiegelt?',goal:6,level:adaptive.mental};
 if(f==='visualSearch')return {family:f,kind:'search',name:'Visual Search',mode:'tap',desc:'Finde und tippe das abweichende Zeichen.',goal:8,level:adaptive.search};
 if(f==='mot')return {family:f,kind:'mot',name:'Multiple Object Tracking',mode:'tap',desc:'Merke dir die blauen Ziele, verfolge sie und wähle sie anschließend.',goal:3,level:adaptive.mot};
 return {family:f,kind:'prediction',name:'Motion Prediction',mode:'tap',desc:'Bahn fortsetzen und die erwartete Endhöhe frei auf der rechten Ziellinie wählen.',goal:5,level:adaptive.prediction,variant:pick(['moving','dashed','static'])};
}

function startSession(){
 clearRun(); metrics=[]; session=composeSession(); index=0; player.classList.add('open'); showPreview();
}
function showPreview(){
 clearRun(); state='preview'; current=session[index];
 progress.style.width=(index/6*100)+'%'; count.textContent=(index+1)+'/6'; setMode(current.mode);
 nameEl.textContent=current.name; desc.textContent=current.desc; substat.textContent='';
 stage.innerHTML=preview(current); action.disabled=false; action.textContent='START';
}
function preview(e){
 if(e.kind==='saccH')return '<div class="axis h"></div><div class="dot" style="left:16%;top:50%"></div><div class="dot" style="left:84%;top:50%"></div>';
 if(e.kind==='saccV')return '<div class="axis v"></div><div class="dot" style="left:50%;top:16%"></div><div class="dot" style="left:50%;top:84%"></div>';
 if(e.kind==='saccD1')return '<div class="axis d1"></div><div class="dot" style="left:18%;top:18%"></div><div class="dot" style="left:82%;top:82%"></div>';
 if(e.kind==='saccD2')return '<div class="axis d2"></div><div class="dot" style="left:82%;top:18%"></div><div class="dot" style="left:18%;top:82%"></div>';
 if(e.kind==='sacc4')return FIX.filter((_,i)=>[0,2,5,7].includes(i)).map(p=>`<div class="dot" style="left:${p.x}%;top:${p.y}%"></div>`).join('');
 if(e.kind==='pH')return '<div class="axis h"></div><div class="dot" style="left:50%;top:50%"></div>';
 if(e.kind==='pV')return '<div class="axis v"></div><div class="dot" style="left:50%;top:50%"></div>';
 if(e.kind==='p8')return '<svg class="figure8" viewBox="0 0 400 220"><path d="M55 110 C55 25 170 25 200 110 C230 195 345 195 345 110 C345 25 230 25 200 110 C170 195 55 195 55 110"/><circle cx="55" cy="110" r="15" fill="#2f6df6"/></svg>';
 if(e.kind==='pC')return '<div style="width:min(58vw,280px);aspect-ratio:1;border:4px solid #c9cbd0;border-radius:50%;position:relative"><div class="dot" style="left:50%;top:0"></div></div>';
 if(e.kind==='stabilize'){const p=e.sequence[0];return `<div class="head"></div><div class="fixPoint" style="left:${p.x}%;top:${p.y}%"></div><div class="headArrow" style="left:${p.ax}%;top:${p.ay}%;transform:translate(-50%,-50%)">${p.arrow}</div><div class="fixLabel">${p.label} fixieren · Kopf ${p.arrow}</div>`}
 if(e.kind==='nearFar')return '<div class="nearfar"><div class="near">●</div><div class="far">K</div></div>';
 if(e.kind==='alphabet')return '<div class="bigLetter">R</div><div style="position:absolute;right:17%;bottom:18%;font-size:38px;font-weight:950">K</div>';
 if(e.kind==='periphery')return '<div class="periRing"><div class="periFix"></div><div class="periFlash" style="left:88%;top:18%"></div></div>';
 if(e.kind==='reaction')return '<div class="target" style="left:50%;top:50%"></div>';
 if(e.kind==='gonogo')return '<div class="gngSymbol">GO / STOP</div>';
 if(e.kind==='stroop')return '<div class="rule">REGEL: SCHRIFTFARBE</div><div class="stroopWord" style="color:#2f6df6">ROT</div>';
 if(e.kind==='mental')return mentalPreview();
 if(e.kind==='search')return '<div class="searchGrid" style="--cols:5"><button>O</button><button>O</button><button>Q</button><button>O</button><button>O</button><button>O</button><button>O</button><button>O</button><button>O</button><button>O</button></div>';
 if(e.kind==='mot')return '<div class="motDot targeted" style="left:22%;top:30%"></div><div class="motDot" style="left:50%;top:20%"></div><div class="motDot targeted" style="left:72%;top:62%"></div><div class="motDot" style="left:38%;top:68%"></div><div class="motDot" style="left:82%;top:28%"></div>';
 return predictionPreview(e.variant);
}
function predictionPreview(v){
 const path='M 7 72 Q 34 20 59 42';
 if(v==='moving')return `<div class="motionArea"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="#2f6df6" stroke-width="2.4"/><path d="M59 42 Q76 54 90 66" fill="none" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="3 3"/></svg><div class="occluder"></div><div class="goalLine"></div><div class="userMark" style="left:90%;top:66%"></div><div class="motionHelp">Kugel verschwindet hinter der Blende → Endhöhe rechts tippen</div></div>`;
 if(v==='dashed')return `<div class="motionArea"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="#2f6df6" stroke-width="2.4" stroke-dasharray="3 3"/></svg><div class="goalLine"></div><div class="userMark" style="left:90%;top:66%"></div><div class="motionHelp">Gestrichelte Kurve endet früh → im Kopf bis rechts verlängern</div></div>`;
 return `<div class="motionArea"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="#2f6df6" stroke-width="2.4"/></svg><div class="goalLine"></div><div class="userMark" style="left:90%;top:66%"></div><div class="motionHelp">Statische Kurve endet früh → Richtung und Krümmung fortsetzen</div></div>`;
}

function startExercise(){if(state!=='preview')return;state='run';action.disabled=true;action.textContent='LÄUFT …';run(current)}
function run(e){
 if(e.kind.startsWith('sacc'))return runSaccade(e);
 if(e.kind.startsWith('p'))return runPursuit(e);
 if(e.kind==='stabilize')return runStabilize(e);
 if(e.kind==='nearFar')return runNearFar(e);
 if(e.kind==='alphabet')return runAlphabet(e);
 if(e.kind==='periphery')return runPeriphery(e);
 if(e.kind==='reaction')return runReaction(e);
 if(e.kind==='gonogo')return runGoNoGo(e);
 if(e.kind==='stroop')return runStroop(e);
 if(e.kind==='mental')return runMental(e);
 if(e.kind==='search')return runSearch(e);
 if(e.kind==='mot')return runMOT(e);
 if(e.kind==='prediction')return runPrediction(e);
}
function countdown(sec,onDone){
 let left=sec, tok=runToken; count.textContent=left+'s';
 timer=setInterval(()=>{if(tok!==runToken)return;left--;count.textContent=Math.max(0,left)+'s';if(left<=0){clearInterval(timer);timer=null;onDone()}},1000);
}
function runSaccade(e){

  zone.onclick=ev=>{
   zone.onclick=null;const r=stage.getBoundingClientRect(),y=(ev.clientY-r.top)/r.height*100,err=Math.abs(y-truthY),threshold=[15,13,11,9,8][e.level-1],ok=err<=threshold;d.total++;d.errs.push(err);if(ok)d.good++;flash(ok);
   const area=stage.querySelector('.motionArea');const u=document.createElement('div');u.className='userMark';u.style.left='90%';u.style.top=y+'%';area.appendChild(u);const t=document.createElement('div');t.className='truthMark';t.style.left='90%';t.style.top=truthY+'%';area.appendChild(t);stage.querySelector('#truthPath').style.opacity='1';if(stage.querySelector('.occluder'))stage.querySelector('.occluder').style.opacity='.35';
   substat.textContent=(ok?'Gute Vorhersage':'Daneben')+' · Fehler '+err.toFixed(1);count.textContent=d.good+' / '+d.goal+' gut';timeout(round,1250)
  }
 }
 function finish(){const avgErr=d.errs.reduce((a,b)=>a+b,0)/d.errs.length,acc=d.good/d.total,newL=adapt('prediction',acc,null,0);metrics.push({family:'prediction',measured:true,acc,rt:null,level:newL});showResult(`<div class="result"><div class="eyebrow">MOTION PREDICTION</div><div class="big">${d.good}/${d.total}</div><div class="line">Ø Fehler ${avgErr.toFixed(1)} · Level ${newL}</div></div>`)}
 round()
}

function showResult(html){
 clearRun();state='result';stage.innerHTML=html;count.textContent=(index+1)+'/6';substat.textContent='';action.disabled=false;action.textContent=index===5?'TRAINING ABSCHLIESSEN':'NÄCHSTE ÜBUNG'
}
function next(){if(state!=='result')return;index++;if(index>=6)return finishSession();showPreview()}
function finishSession(){
 clearRun();state='finish';progress.style.width='100%';count.textContent='6/6';setMode('look');mode.textContent='FERTIG';nameEl.textContent='';desc.textContent='';substat.textContent='';
 const measured=metrics.filter(m=>m.measured),acc=measured.length?measured.filter(m=>typeof m.acc==='number').reduce((a,b)=>a+b.acc,0)/measured.filter(m=>typeof m.acc==='number').length:0,rts=measured.filter(m=>m.rt);const rt=rts.length?rts.reduce((a,b)=>a+b.rt,0)/rts.length:0;
 stage.innerHTML=`<div class="summary"><h2>TRAINING<br>COMPLETE</h2><p>${measured.length?`Accuracy ${Math.round(acc*100)}%${rt?' · Reaction '+Math.round(rt)+' ms':''}`:'6 Übungen abgeschlossen'}</p></div>`;
 action.disabled=false;action.textContent='ZURÜCK'
}
function close(){clearRun();player.classList.remove('open');state='home'}
$('#play').onclick=startSession;$('#close').onclick=close;action.onclick=()=>{if(state==='preview')startExercise();else if(state==='result')next();else if(state==='finish')close()}
})();
</script>
</body>
</html>
