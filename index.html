.historyOverlay{display:none;position:fixed;inset:0;background:var(--paper);z-index:95}.historyOverlay.open{display:block}.historyShell{height:100dvh;width:100%;padding:max(18px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}.historyHead{display:flex;align-items:center;justify-content:space-between}.historyTitle{font-size:clamp(30px,5vw,48px);font-weight:950;letter-spacing:-.05em}.historyClose{font-size:28px}.historyList{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));align-content:start;gap:12px}.historyCard{background:#e9e6de;border-radius:22px;padding:18px}.historyDate{font-size:12px;font-weight:900;color:#79818d}.historyMain{font-size:21px;font-weight:950;margin-top:6px}.historySub{font-size:13px;line-height:1.45;color:#65707c;margin-top:6px}.historyEmpty{display:grid;place-items:center;min-height:50vh;color:#77808c;font-weight:850}
@media (min-width:768px){.app{padding-left:max(34px,env(safe-area-inset-left));padding-right:max(34px,env(safe-area-inset-right))}.brandMark{width:52px;height:38px}.historyBtn,.close,.historyClose{width:56px;height:56px}.shell{padding:max(22px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));gap:16px}.topbar{grid-template-columns:56px minmax(0,1fr) 70px;gap:16px}.stage{border-radius:42px}.content{gap:16px}.action{min-height:66px;font-size:19px;border-radius:22px}.mode{font-size:13px;padding:10px 16px}.substat{font-size:15px}.periphChoices,.choices,.mentalChoices{bottom:24px;gap:14px}.periphChoices button,.choices button,.mentalChoices button{min-height:64px}}
@media (min-width:900px) and (orientation:landscape){.content{grid-template-columns:minmax(0,1fr) minmax(310px,30vw);grid-template-rows:minmax(0,1fr);gap:18px}.side{height:100%;justify-content:center;padding:12px 8px}.meta{gap:10px}.action{width:100%;margin-top:10px}.stage{height:100%}.desc{max-width:420px}.historyList{grid-template-columns:repeat(3,1fr)}}
@media (max-height:520px) and (orientation:landscape){.shell{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom));gap:8px}.content{grid-template-columns:minmax(0,1fr) minmax(250px,34vw);grid-template-rows:minmax(0,1fr);gap:10px}.stage{border-radius:24px}.side{justify-content:center;gap:5px}.mode{padding:6px 10px}.name{font-size:24px}.desc{font-size:12px}.substat{font-size:11px}.action{min-height:48px;padding:10px}.topbar{grid-template-columns:44px 1fr 52px}.close{width:44px;height:44px}}

/* RETHINK shared design family */
.historyBtn,.close,.historyClose{
  background:#fff;border:1px solid var(--line);box-shadow:0 5px 18px rgba(35,27,18,.05)
}
.stage{
  background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:28px
}
.mode{background:#fff3e9;color:#8a3f08;border:1px solid #ffd9bd}
.mode.tap,.mode.head{background:#fff3e9;color:#8a3f08}
.action{
  background:var(--accent);color:var(--ink);border-radius:16px;
  box-shadow:0 8px 22px rgba(255,122,26,.20)
}
.action:disabled{background:#d5d1ca;color:#77736e;box-shadow:none}
.play{background:var(--accent);box-shadow:0 18px 46px rgba(255,122,26,.25)}
.play:after{border-left-color:var(--ink)}
.progressWrap{background:#e7dfd4}.progress{background:var(--accent)}
.count{color:var(--accent)}
.historyCard{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:0 6px 22px rgba(35,27,18,.05)
}
.periphChoices button,.choices button,.mentalChoices button{
  border:1px solid var(--line);border-radius:14px;
  box-shadow:0 4px 14px rgba(35,27,18,.05)
}
.historyTools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolBtn{
  min-height:50px;border-radius:14px;border:1px solid var(--line);
  background:#fff;font-weight:900;font-size:14px
}
.toolBtn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.backupNote{min-height:18px;font-size:12px;color:var(--muted);font-weight:750;text-align:center}
.brandMark{width:34px;height:34px}
.brandMark .focusRing{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round}
.brandMark .focusDot{fill:var(--accent)}
@media (min-width:768px){
  .stage{border-radius:30px}
  .action{border-radius:16px}
}

<body>
<div class="app">
 <div class="homeTop">
  <div class="brand"><svg class="brandMark" viewBox="0 0 48 48" aria-hidden="true">
  <path class="focusRing" d="M9 17C12 10 17 7 24 7M39 17C36 10 31 7 24 7M9 31C12 38 17 41 24 41M39 31C36 38 31 41 24 41"/>
  <circle class="focusDot" cx="24" cy="24" r="7"/>
</svg><span>EYETRAINER</span></div>
  <button class="historyBtn" id="historyBtn" aria-label="Letzte Ergebnisse"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg></button>
 </div>
 <main class="home"><div class="hero">PLAY.<br>TRAIN.</div><button class="play" id="play" aria-label="Training starten"></button></main>
</div>
<div class="historyOverlay" id="historyOverlay"><div class="historyShell">
 <div class="historyHead"><div class="historyTitle">ERGEBNISSE</div><button class="historyClose" id="historyClose" aria-label="Schließen">×</button></div>
 <div class="historyList" id="historyList"></div>
 <div class="historyTools">
   <button class="toolBtn primary" id="backupBtn">BACKUP</button>
   <button class="toolBtn" id="restoreBtn">WIEDERHERSTELLEN</button>
 </div>
 <div class="backupNote" id="backupNote"></div>
 <input id="restoreInput" type="file" accept=".zip,application/zip" hidden>
</div></div>
<div class="player" id="player"><div class="feedback" id="feedback"></div><div class="shell">
 <div class="topbar"><button class="close" id="close" aria-label="Training schließen">×</button><div class="progressWrap"><div class="progress" id="progress"></div></div><div class="count" id="count">1/6</div></div>
 <div class="content"><div class="stage" id="stage"></div><div class="side"><div class="meta"><div class="mode" id="mode">NUR SCHAUEN</div><div class="name" id="name"></div><div class="desc" id="desc"></div><div class="substat" id="substat"></div></div><button class="action" id="action">START</button></div></div>
</div></div>
<script>
(function(){'use strict';
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const P=new URLSearchParams(location.search),TEST=P.get('test')==='1',SCALE=TEST?.025:1;
const stage=$('#stage'),player=$('#player'),progress=$('#progress'),count=$('#count'),mode=$('#mode'),nameEl=$('#name'),desc=$('#desc'),substat=$('#substat'),action=$('#action');
const ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');let session=[],index=0,state='home',current=null,timer=null,aux=[],raf=null,runToken=0,metrics=[];
const DEFAULT_LEVELS={peripheralLetters:1,reaction:1,inhibition:1,stroop:1,search:1,mot:1,mental:1,prediction:1};
let adaptive=load('eyetrainer.levels',DEFAULT_LEVELS),cycles=load('eyetrainer.cycles',{oculo:0,focus:0,inhibit:0,complex:0});
function load(k,d){try{return Object.assign({},d,JSON.parse(localStorage.getItem(k)||'{}'))}catch(e){return {...d}}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function getHistory(){try{return JSON.parse(localStorage.getItem('eyetrainer.history')||'[]')}catch(e){return[]}}function setHistory(v){try{localStorage.setItem('eyetrainer.history',JSON.stringify(v.slice(0,10)))}catch(e){}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function pick(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function later(fn,ms){const id=setTimeout(fn,Math.max(8,ms*SCALE));aux.push(id);return id}function clearRun(){runToken++;if(timer)clearInterval(timer);timer=null;aux.forEach(clearTimeout);aux=[];if(raf)cancelAnimationFrame(raf);raf=null;stage.onclick=null}
function flash(ok){const f=$('#feedback');f.className='feedback '+(ok?'ok':'bad');requestAnimationFrame(()=>f.classList.add('show'));setTimeout(()=>f.classList.remove('show'),Math.max(50,230*SCALE))}function fmtRT(v){return v?Math.round(v)+' ms':'–'}
function setMode(m){mode.className='mode '+(m==='tap'?'tap':m==='head'?'head':'');mode.textContent=m==='tap'?'TIPPEN':m==='head'?'GUCKEN + KOPF':'NUR SCHAUEN'}
function cycle(key,arr){const n=cycles[key]||0;cycles[key]=(n+1)%arr.length;save('eyetrainer.cycles',cycles);return arr[n%arr.length]}
const FIX=[{x:14,y:14,label:'links oben',arrow:'↘',ax:86,ay:82},{x:50,y:11,label:'oben Mitte',arrow:'↓',ax:50,ay:84},{x:86,y:14,label:'rechts oben',arrow:'↙',ax:14,ay:82},{x:11,y:50,label:'links Mitte',arrow:'→',ax:86,ay:50},{x:89,y:50,label:'rechts Mitte',arrow:'←',ax:14,ay:50},{x:14,y:86,label:'links unten',arrow:'↗',ax:86,ay:18},{x:50,y:89,label:'unten Mitte',arrow:'↑',ax:50,ay:16},{x:86,y:86,label:'rechts unten',arrow:'↖',ax:14,ay:18}];
const QUIET=[
 {family:'saccade',kind:'saccH',name:'Sakkaden horizontal',mode:'look',desc:'Kopf ruhig. Nur mit den Augen links ↔ rechts.',sec:24},
 {family:'saccade',kind:'saccV',name:'Sakkaden vertikal',mode:'look',desc:'Kopf ruhig. Nur mit den Augen oben ↕ unten.',sec:24},
 {family:'saccade',kind:'saccD1',name:'Sakkaden diagonal',mode:'look',desc:'Kopf ruhig. Links oben ↔ rechts unten.',sec:24},
 {family:'saccade',kind:'saccD2',name:'Sakkaden diagonal',mode:'look',desc:'Kopf ruhig. Rechts oben ↔ links unten.',sec:24},
 {family:'saccade',kind:'sacc4',name:'4-Punkt-Sakkaden',mode:'look',desc:'Kopf ruhig. Nur den jeweils aktiven Punkt ansehen.',sec:24},
 {family:'pursuit',kind:'pH',name:'Smooth Pursuit horizontal',mode:'look',desc:'Den einzelnen Punkt flüssig verfolgen. Kopf ruhig.',sec:28},
 {family:'pursuit',kind:'pV',name:'Smooth Pursuit vertikal',mode:'look',desc:'Den einzelnen Punkt flüssig verfolgen. Kopf ruhig.',sec:28},
 {family:'pursuit',kind:'p8',name:'Smooth Pursuit – Acht',mode:'look',desc:'Den einzelnen Punkt flüssig verfolgen. Keine Bahn sichtbar.',sec:30},
 {family:'pursuit',kind:'pC',name:'Smooth Pursuit – Kreis',mode:'look',desc:'Den einzelnen Punkt flüssig verfolgen. Keine Bahn sichtbar.',sec:30}
];
function make(kind){
 const q=QUIET.find(x=>x.kind===kind);if(q)return {...q};
 if(kind==='stabilize')return {family:'stabilize',kind,name:'Fixierung + Kopfbewegung',mode:'head',desc:'Punkt fixieren. Kopf in Pfeilrichtung bewegen.',sequence:shuffle(FIX).slice(0,4)};
 if(kind==='nearFar')return {family:'nearFar',kind,name:'Nah–Fern Fokus',mode:'look',desc:'Eigenen Daumen nah fokussieren, dann Bildschirmbuchstaben scharf ansehen.',sec:30};
 if(kind==='peripheralLetters')return {family:kind,kind,name:'Periphere Buchstaben',mode:'tap',desc:'Mitte fixieren. Buchstaben weit außen erkennen und anschließend auswählen.',trials:8,level:adaptive.peripheralLetters};
 if(kind==='reaction')return {family:kind,kind,name:'Reaction Tap',mode:'tap',desc:'Ziel so schnell wie möglich antippen.',sec:20,level:adaptive.reaction};
 if(kind==='gonogo')return {family:'inhibition',kind,name:'Go / No-Go',mode:'tap',desc:'Regel beachten: GO tippen, NO-GO auslassen.',trials:12,level:adaptive.inhibition};
 if(kind==='stroop')return {family:'stroop',kind,name:'Stroop',mode:'tap',desc:'Regel oben beachten und die passende Antwort wählen.',trials:8,level:adaptive.stroop};

function rotPt(p,r){let[x,y,z]=p;for(const a of r){if(a==='x')[y,z]=[-z,y];if(a==='y')[x,z]=[z,-x];if(a==='z')[x,y]=[-y,x]}return[x,y,z]}function isoSvg(shape,rot,mirror){let pts=shape.map(p=>rotPt([mirror?-p[0]:p[0],p[1],p[2]],rot));const minx=Math.min(...pts.map(p=>p[0])),miny=Math.min(...pts.map(p=>p[1])),minz=Math.min(...pts.map(p=>p[2]));pts=pts.map(p=>[p[0]-minx,p[1]-miny,p[2]-minz]);const faces=[];for(const [x,y,z] of pts){const X=110+(x-y)*35,Y=45+(x+y)*19-z*37;faces.push(`<polygon points="${X},${Y-36} ${X+34},${Y-17} ${X},${Y+2} ${X-34},${Y-17}" fill="#d9dce3" stroke="#0b1018" stroke-width="2"/><polygon points="${X-34},${Y-17} ${X},${Y+2} ${X},${Y+40} ${X-34},${Y+21}" fill="#b8bec8" stroke="#0b1018" stroke-width="2"/><polygon points="${X+34},${Y-17} ${X},${Y+2} ${X},${Y+40} ${X+34},${Y+21}" fill="#8f98a6" stroke="#0b1018" stroke-width="2"/>`)}return `<svg viewBox="0 0 230 230">${faces.join('')}</svg>`}function mentalPreview(){const sh=SHAPES[0];return `<div class="isoPair"><div class="iso">${isoSvg(sh,['x'],false)}</div><div class="iso">${isoSvg(sh,['z','y'],false)}</div></div>`}function runMental(e){let trial=0,correct=0,rts=[],tok=runToken,answered=false;function next(){if(tok!==runToken)return;if(trial>=e.trials)return finish();trial++;answered=false;const sh=pick(SHAPES),mirror=Math.random()<.5,rots=[[],['x'],['y'],['z'],['x','y'],['z','y'],['x','z','y']],r1=pick(rots),r2=pick(rots),start=performance.now();stage.innerHTML=`<div class="isoPair"><div class="iso">${isoSvg(sh,r1,false)}</div><div class="iso">${isoSvg(sh,r2,mirror)}</div></div><div class="mentalChoices"><button data-correct="${!mirror?1:0}">IDENTISCH</button><button data-correct="${mirror?1:0}">GESPIEGELT</button></div>`;count.textContent=trial+' / '+e.trials;const to=later(()=>respond(false,6000),6000);$$('.mentalChoices button').forEach(b=>b.onclick=()=>{if(answered)return;clearTimeout(to);respond(b.dataset.correct==='1',performance.now()-start)})}function respond(ok,rt){if(answered)return function predictionPreview(){return '<div class="motionArea"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M7 70 Q35 22 58 42" fill="none" stroke="#ff7a1a" stroke-width="2.6"/></svg><div class="goalLine"></div><div class="motionHelp">Kurve oder Bewegung fortsetzen → Endhöhe rechts tippen</div></div>'}function makeCurve(level){const y0=pick([28,36,44,56,64,72]),slope=(Math.random()*28-14),curv=(Math.random()*2-1)*[9,12,15,18,21][level-1];return u=>clamp(y0+slope*u+curv*(u*u-u*.15),10,90)}function pathOf(fn,to=1){const pts=[];for(let i=0;i<=34;i++){const u=to*i/34;pts.push([(7+83*u).toFixed(2),fn(u).toFixed(2)])}return 'M '+pts.map(p=>p.join(' ')).join(' L ')}function runPrediction(e){let trial=0,good=0,errs=[],tok=runToken,answered=false;function next(){if(tok!==runToken)return;if(trial>=e.trials)return finish();trial++;answered=false;const fn=makeCurve(e.level),cut=[.68,.63,.59,.55,.52][e.level-1],truth=fn(1),moving=trial%2===1,visible=pathOf(fn,cut),full=pathOf(fn,1);stage.innerHTML=`<div class="motionArea"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path id="vis" d="${visible}" fill="none" stroke="#ff7a1a" stroke-width="2.5" style="${moving?'opacity:0':''}"/><path id="truth" d="${full}" fill="none" stroke="#21884a" stroke-width="2.3" style="opacity:0"/></svg>${moving?'<div class="occluder"></div>':''}<div class="goalLine"></div><div class="motionTapZone"></div><div class="motionHelp">${moving?'Kugel beobachten – danach Endhöhe rechts wählen':'Kurve gedanklich fortsetzen – Endhöhe rechts wählen'}</div></div>`;count.textContent=trial+' / '+e.trials;if(moving){const ball=document.createElement('div');ball.className='ball';stage.querySelector('.motionArea').appendChild(ball);const start=performance.now(),dur=1900*SCALE;function loop(t){if(tok!==runToken)return;const u=clamp((t-start)/dur,0,cut);ball.style.left=(7+83*u)+'%';ball.style.top=fn(u)+'%';if(u<cut)raf=requestAnimationFrame(loop);else{ball.style.display='none';substat.textContent='Jetzt Endhöhe wählen'}}raf=requestAnimationFrame(loop)}else substat.textContent='Richtung + Krümmung fortsetzen';const zone=stage.querySelector('.motionTapZone'),to=later(()=>respond(null),6000);zone.onclick=ev=>{if(answered)return;clearTimeout(to);const r=stage.getBoundingClientRect();respond((ev.clientY-r.top)/r.height*100)};function respond(y){if(answered)return;answered=true;zone.onclick=null;let err=100,ok=false;if(y!=null){err=Math.abs(y-truth);ok=err<=[14,12,10,9,8][e.level-1];errs.push(err)}if(ok)good++;flash(ok);const area=stage.querySelector('.motionArea');if(y!=null){const um=document.createElement('div');um.className='userMark';um.style.left='90%';um.style.top=y+'%';area.appendChild(um)}const tm=document.createElement('div');tm.className='truthMark';tm.style.left='90%';tm.style.top=truth+'%';area.appendChild(tm);$('#truth').style.opacity='1';const oc=stage.querySelector('.occluder');if(oc)oc.style.opacity=.3;later(next,750)}}function finish(){const acc=good/e.trials,avg=errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:100,nl=adapt('prediction',acc,null,0);metrics.push({family:e.family,label:e.name,measured:true,acc,rt:null,level:nl});showMetric('MOTION PREDICTION',good+'/'+e.trials,`Ø Fehler ${avg.toFixed(1)} · Level ${nl}`)}next()}
function showMetric(label,value,detail){showResult(`<div class="resultOnly"><div class="eyebrow">${label}</div><div class="value">${value}</div><div class="detail">${detail}</div></div>`)}function showResult(html){clearRun();state='result';document.body.dataset.state='result';stage.innerHTML=html;count.textContent=(index+1)+'/6';setMode('look');mode.textContent='FERTIG';desc.textContent='Bereit für die nächste Übung.';substat.textContent='';action.disabled=false;action.textContent=index===5?'TRAINING ABSCHLIESSEN':'NÄCHSTE ÜBUNG'}
function nextResult(){if(state!=='result')return;index++;if(index>=6)return finishSession();showPreview()}function finishSession(){clearRun();state='finish';document.body.dataset.state='finish';progress.style.width='100%';count.textContent='6/6';setMode('look');mode.textContent='FERTIG';nameEl.textContent='';desc.textContent='';substat.textContent='';const measured=metrics.filter(x=>x.measured),accs=measured.filter(x=>typeof x.acc==='number'),acc=accs.length?accs.reduce((a,b)=>a+b.acc,0)/accs.length:null,rts=measured.filter(x=>x.rt),rt=rts.length?rts.reduce((a,b)=>a+b.rt,0)/rts.length:null;const entry={date:new Date().toISOString(),accuracy:acc,rt,items:measured.map(x=>({label:x.label,acc:x.acc,rt:x.rt,level:x.level}))};const h=getHistory();h.unshift(entry);setHistory(h);stage.innerHTML=`<div class="summary"><h2>TRAINING<br>FERTIG</h2><p>${acc!=null?'Genauigkeit '+Math.round(acc*100)+'%':''}${rt?' · Ø '+Math.round(rt)+' ms':''}</p></div>`;action.disabled=false;action.textContent='ZURÜCK'}function close(){clearRun();player.classList.remove('open');state='home';document.body.dataset.state='home'}
function renderHistory(){const list=$('#historyList'),h=getHistory();list.innerHTML='';if(!h.length){list.innerHTML='<div class="historyEmpty">Noch keine abgeschlossenen Trainings.</div>';return}h.forEach(x=>{const d=new Date(x.date),card=document.createElement('div');card.className='historyCard';const main=x.accuracy!=null?'Genauigkeit '+Math.round(x.accuracy*100)+'%'+(x.rt?' · '+Math.round(x.rt)+' ms':''):'Training abgeschlossen',detail=(x.items||[]).map(i=>i.label+(i.acc!=null?' '+Math.round(i.acc*100)+'%':'')+(i.level?' · L'+i.level:'')).join(' · ');card.innerHTML=`<div class="historyDate">${d.toLocaleDateString('de-DE')} · ${d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div><div class="historyMain">${main}</div><div class="historySub">${detail||'6 Übungen'}</div>`;list.appendChild(card)})}

function crc32(bytes){
 let c=0xffffffff;
 for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}
 return (c^0xffffffff)>>>0
}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function catBytes(...parts){
 const len=parts.reduce((n,p)=>n+p.length,0),out=new Uint8Array(len);let off=0;
 for(const p of parts){out.set(p,off);off+=p.length}return out
}
function makeStoreZip(filename,text){
 const enc=new TextEncoder(),name=enc.encode(filename),data=enc.encode(text),crc=u32(crc32(data)),size=u32(data.length);
 const local=catBytes(
  new Uint8Array([0x50,0x4b,0x03,0x04]),u16(20),u16(0),u16(0),u16(0),u16(0),
  crc,size,size,u16(name.length),u16(0),name,data
 );
 const central=catBytes(
  new Uint8Array([0x50,0x4b,0x01,0x02]),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
  crc,size,size,u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(0),name
 );
 const end=catBytes(
  new Uint8Array([0x50,0x4b,0x05,0x06]),u16(0),u16(0),u16(1),u16(1),
  u32(central.length),u32(local.length),u16(0)
 );
 return new Blob([local,central,end],{type:'application/zip'})
}
function backupPayload(){
 const data={format:'RETHINK.EyeTrainer.Backup',version:1,created:new Date().toISOString(),storage:{}};
 for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('eyetrainer.'))data.storage[k]=localStorage.getItem(k)}
 return data
}
function exportBackup(){
 try{
  const d=new Date(),date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const blob=makeStoreZip('backup.json',JSON.stringify(backupPayload(),null,2)),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='RETHINK_Backup_'+date+'.zip';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);$('#backupNote').textContent='Backup erstellt.'
 }catch(e){$('#backupNote').textContent='Backup konnte nicht erstellt werden.'}
}
async function restoreBackup(file){
 try{
  const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
  if(dv.getUint32(0,true)!==0x04034b50)throw new Error('zip');
  const method=dv.getUint16(8,true),size=dv.getUint32(18,true),nameLen=dv.getUint16(26,true),extraLen=dv.getUint16(28,true);
  if(method!==0)throw new Error('compression');
  const start=30+nameLen+extraLen,text=new TextDecoder().decode(buf.slice(start,start+size)),data=JSON.parse(text);
  if(data.format!=='RETHINK.EyeTrainer.Backup'||!data.storage)throw new Error('format');
  const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('eyetrainer.'))keys.push(k)}
  keys.forEach(k=>localStorage.removeItem(k));Object.entries(data.storage).forEach(([k,v])=>localStorage.setItem(k,v));
  adaptive=load('eyetrainer.levels',DEFAULT_LEVELS);cycles=load('eyetrainer.cycles',{oculo:0,focus:0,inhibit:0,complex:0});
  renderHistory();$('#backupNote').textContent='Backup wiederhergestellt.'
 }catch(e){$('#backupNote').textContent='Backup nicht lesbar.'}
}
$('#backupBtn').onclick=exportBackup;
$('#restoreBtn').onclick=()=>$('#restoreInput').click();
$('#restoreInput').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)restoreBackup(f);e.target.value=''};

$('#play').onclick=startSession;$('#close').onclick=close;$('#historyBtn').onclick=()=>{renderHistory();$('#historyOverlay').classList.add('open')};$('#historyClose').onclick=()=>$('#historyOverlay').classList.remove('open');action.onclick=()=>{if(state==='preview')startExercise();else if(state==='result')nextResult();else if(state==='finish')close()};
window.__eye={getState:()=>state,getCurrent:()=>current,startExercise:kind=>{metrics=[];session=[make(kind)];index=0;player.classList.add('open');current=session[0];showPreview()},levels:()=>({...adaptive}),history:()=>getHistory(),backupPayload};
if(TEST&&P.get('exercise')){const k=P.get('exercise');setTimeout(()=>window.__eye.startExercise(k),20)}
})();
